<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <script>try{var t=localStorage.getItem("tr_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  <title>Training</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" aria-hidden="true"><img src="branding/logo.png" alt=""></div>
  <script>setTimeout(function(){var b=document.getElementById('boot');if(b)b.remove();},6000);</script>
  <header class="topbar">
    <button id="btn-back" class="icon-btn" aria-label="Retour" hidden>‹</button>
    <h1 id="title">Training</h1>
  </header>

  <main id="view"></main>

  <div id="timer" class="timer-overlay" hidden>
    <div class="timer-box" role="dialog" aria-label="Minuteur">
      <div id="timer-label" class="timer-label">Repos</div>
      <div id="timer-value" class="timer-value">0</div>
      <div id="timer-unit" class="timer-unit">secondes</div>
      <div id="timer-next" class="timer-next"></div>
      <div class="row timer-actions">
        <button id="timer-minus" class="btn ghost">−15 s</button>
        <button id="timer-pause" class="btn ghost">Pause</button>
        <button id="timer-plus" class="btn ghost">+15 s</button>
      </div>
      <button id="timer-skip" class="btn block">Passer</button>
    </div>
  </div>

  <nav class="tabbar">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></a>
    <a href="#/entrainement" data-tab="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10h2V8h2v8H4v-2H2zM20 8h2v2h0v4h-2v2h-2V8h2zM7 6h3v12H7zM14 6h3v12h-3zM10 11h4v2h-4z"/></svg><span>Entraînement</span></a>
    <a href="#/progres" data-tab="progres"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V3h2v16h16v2zM7 16l4-5 3 3 5-7 1.6 1.2-6.4 9-3-3-2.6 3.3z"/></svg><span>Progression</span></a>
    <a href="#/reglages" data-tab="reglages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6.1-1.1-.1-1.1 2.1-1.6-2-3.5-2.5 1a8 8 0 0 0-1.9-1.1L15.8 3h-4l-.4 2.7c-.7.3-1.3.6-1.9 1.1l-2.5-1-2 3.5 2.1 1.6-.1 1.1.1 1.1-2.1 1.6 2 3.5 2.5-1c.6.5 1.2.8 1.9 1.1l.4 2.7h4l.4-2.7c.7-.3 1.3-.6 1.9-1.1l2.5 1 2-3.5z"/></svg><span>Réglages</span></a>
  </nav>

  <script src="version.js"></script>
  <script src="branding.js"></script>
  <script src="seances.js"></script>
  <script src="bibliotheque.js"></script>
  <script src="remplacements.js"></script>
  <script src="catalogue.js"></script>
  <script src="app.js"></script>
</body>
</html>
